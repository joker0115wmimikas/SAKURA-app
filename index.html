    function generateChoices(currentQuestion) {
      try {
        if (currentQuestion.dummies && currentQuestion.dummies.length >= 3) {
          const dums = currentQuestion.dummies.slice(0,3);
          return [currentQuestion.a, ...dums].sort(() => 0.5 - Math.random());
        }
        let sameCategoryData = rawData.filter(d => d.subject === currentQuestion.subject && d.category === currentQuestion.category && d.a !== currentQuestion.a);
        let others = [...new Set(sameCategoryData.map(d => d.a))];

        if (others.length < 3) {
           const sameSubjectData = rawData.filter(d => d.subject === currentQuestion.subject && d.a !== currentQuestion.a);
           const moreOthers = [...new Set(sameSubjectData.map(d => d.a))];
           others = [...new Set([...others, ...moreOthers])];
        }
        const shuffledOthers = others.sort(() => 0.5 - Math.random()).slice(0, 3);
        return [currentQuestion.a, ...shuffledOthers].sort(() => 0.5 - Math.random());
      } catch(e) { return [currentQuestion.a, "ダミーA", "ダミーB", "ダミーC"].sort(() => 0.5 - Math.random()); }
    }

    window.startWeaknessQuizCustom = function(filterType, subjectValue = null) {
      if (state.activeUser === 'guest') { showMessage("ゲストモードでは苦手特訓は使えません。"); return; }
      let targetQuestions = rawData.filter(q => {
        if (filterType === 'vocab' && q.subject !== '英語') return false;
        if (filterType === 'grade2' && (q.grade !== 2 || q.subject !== subjectValue)) return false;
        if (filterType === 'grade1' && (q.grade !== 1 || q.subject !== subjectValue)) return false;
        
        const stat = state.userStats[q.id]; if (!stat) return false;
        const total = stat.corrects + stat.mistakes; if (total === 0) return false;
        return (stat.mistakes / total) >= 0.25 || stat.mistakes > stat.corrects;
      }).sort((a, b) => {
        const statA = state.userStats[a.id] || {corrects:0, mistakes:0}; const statB = state.userStats[b.id] || {corrects:0, mistakes:0};
        const rateA = statA.mistakes / ((statA.corrects + statA.mistakes) || 1); const rateB = statB.mistakes / ((statB.corrects + statB.mistakes) || 1);
        return rateB - rateA;
      });

      if (targetQuestions.length === 0) { showMessage("すばらしい！この範囲の極端に苦手な問題はありません。"); return; }
      prepareQuiz(targetQuestions.slice(0, 20));
    }

    function prepareQuiz(questions) {
      if(!questions || questions.length === 0) return;
      const prepared = questions.map(q => {
        const rand = Math.random();
        let type = 'normal';
        if (rand < 0.4) type = 'choice'; else if (rand < 0.7) type = 'reverse';
        
        let choices = [];
        if (type === 'choice') choices = generateChoices(q);

        let reverseQ = q.a ? String(q.a) : ''; let reverseA = q.q ? String(q.q) : '';
        try {
          if (q.subject === '英語') {
            if (q.category === '英単語') { reverseQ = `「${q.a}」の意味は？`; reverseA = reverseA.replace('」を意味する英単語は？', '').replace('「', ''); } 
            else if (q.category === '熟語・文法') { reverseQ = `「${q.a}」の意味は？`; reverseA = reverseA.replace('」を英語で言うと？', '').replace('「', ''); }
          } else { reverseQ = `「${q.a}」とは何のこと？（どういう意味？）`; }
        } catch(e) {}

        return { ...q, queueId: Math.random().toString(36).substr(2, 9), quizType: type, choices, isRetry: false, reverseQ, reverseA };
      }).sort(() => 0.5 - Math.random());

      state.quizQueue = prepared; state.currentIndex = 0; state.showAnswer = false; state.selectedChoice = null; state.choiceResult = null;
      state.sessionStats = { totalInitial: prepared.length, mistakes: 0 }; state.screen = 'quiz'; render();
    }

    // ==========================================
    // UI イベント制御
    // ==========================================
    window.showMessage = function(text, type='info', onConfirm=null) { state.message = { show: true, text, type, onConfirm }; render(); }
    window.closeMessage = function() { state.message.show = false; render(); }
    window.confirmMessage = function() { if(state.message.onConfirm) state.message.onConfirm(); closeMessage(); }
    
    window.switchUser = function(user) {
      if (state.activeUser === user) return;
      if (state.passwords && state.passwords[user] && user !== 'guest') { state.pin = { show: true, mode: 'auth', targetUser: user, value: '', error: false }; render(); return; }
      executeUserSwitch(user);
    }
    function executeUserSwitch(user) { state.activeUser = user; state.activeTab = 'study'; state.pin.show = false; loadStatsForCurrentUser(); startParticles(); render(); }

    window.openPinSetup = function() { state.pin = { show: true, mode: 'setup', targetUser: state.activeUser, value: '', error: false }; render(); }
    window.removePin = function() {

        }

    window.deletePin = function() { state.pin.value = state.pin.value.slice(0, -1); state.pin.error = false; render(); }
    window.closePin = function() { state.pin.show = false; render(); }

    function checkPin() {
      const { mode, targetUser, value } = state.pin; const isMaster = (value === '1151');
      if (mode === 'auth') {
        if (value === state.passwords[targetUser] || isMaster) { executeUserSwitch(targetUser); }

    window.goHome = function() { state.screen = 'home'; render(); }
    
    window.handleAnswer = async function(isCorrect) {
      const currentQ = state.quizQueue[state.currentIndex];
      if (state.activeUser !== 'guest') {
        const currentStat = state.userStats[currentQ.id] || { corrects: 0, mistakes: 0 };
        const newData = { corrects: isCorrect ? currentStat.corrects + 1 : currentStat.corrects, mistakes: !isCorrect ? currentStat.mistakes + 1 : currentStat.mistakes, lastAttempt: new Date().toISOString() };
        state.userStats[currentQ.id] = newData; 
        saveLocalStats(); 

        if (state.user && state.fbReady && db) { 
          try { const collectionName = state.activeUser === 'sakura' ? 'shared_stats' : 'shared_stats_momoka'; db.collection('artifacts').doc(appId).collection('public').doc('data').collection(collectionName).doc(currentQ.id).set(newData, { merge: true }).catch(() => {}); } catch(e) {} 
        }
      }
      if (!isCorrect) { state.quizQueue.push({ ...currentQ, queueId: Math.random().toString(36).substr(2, 9), isRetry: true }); state.sessionStats.mistakes++; }
      if (state.currentIndex + 1 < state.quizQueue.length || !isCorrect) { state.currentIndex++; state.showAnswer = false; state.selectedChoice = null; state.choiceResult = null; } 
      else { state.screen = 'result'; }
      render();

    function generateAiEvaluation() {
      let totalAttempts = 0; let totalMistakes = 0; let categoryStats = {};
      rawData.forEach(q => {
        if(!categoryStats[q.category]) categoryStats[q.category] = { attempts: 0, mistakes: 0, qs: [] };
        const stat = state.userStats[q.id];
        if (stat) { const attempts = stat.corrects + stat.mistakes; if (attempts > 0) { totalAttempts += attempts; totalMistakes += stat.mistakes; categoryStats[q.category].attempts += attempts; categoryStats[q.category].mistakes += stat.mistakes; categoryStats[q.category].qs.push({ q: q.q, mistakes: stat.mistakes }); } }
      });
      const userName = userThemes[state.activeUser].name;
      if (totalAttempts === 0) return `なんじゃ、まだ一度もアプリを開いておらぬではないか！\n怠惰は最大の罪なり。まずは${userName}にアプリを開かせ、一問でも解かせるのじゃ！`;
      const accuracy = totalAttempts > 0 ? ((totalAttempts - totalMistakes) / totalAttempts) * 100 : 0;
      let evalText = `ふむ。我の帳簿によると、${userName}のこれまでの総解答数は【${totalAttempts}回】、正答率は【${Math.round(accuracy)}％】じゃな。\n\n`;
      if (accuracy >= 90) evalText += "見事な精進ぶりじゃ！地道な努力がしっかりと実を結んでおる。\nしかし、悪魔は油断した隙に忍び寄るもの。慢心せず、さらなる高みを目指させよ！\n";
      else if (accuracy >= 60) evalText += "まずまずの出来じゃな。努力の跡は見られるぞ。\nだが、まだ知識が定着しておらぬ部分がちらほら見受けられる。反復こそが記憶の定着への近道じゃ！\n";
      else evalText += "むむっ……これは少々苦戦しておるようじゃな。\n基礎がグラついておるかもしれんぞ。焦らず、一歩ずつ確実に理解させるのじゃ！\n";
      let worstCategory = null; let maxMistakeRate = -1;
      for (let cat in categoryStats) { if (categoryStats[cat].attempts > 1) { const rate = categoryStats[cat].mistakes / categoryStats[cat].attempts; if (rate > maxMistakeRate) { maxMistakeRate = rate; worstCategory = cat; } } }
      if (worstCategory && maxMistakeRate > 0) {
        evalText += `\nとくに、【${worstCategory}】の分野に深い闇（弱点）を感じるぞ……。`;
        const worstQs = categoryStats[worstCategory].qs.sort((a,b) => b.mistakes - a.mistakes);
        if(worstQs.length > 0 && worstQs[0].mistakes > 0) { evalText += `\nたとえば「${worstQs[0].q.substring(0, 15)}...」といった問題を何度も間違えておるようじゃ。\nこの辺りを重点的に復習させるのが点数アップへの道標じゃ！`; }
      } else { evalText += `\n今のところ、極端に苦手な深淵は見当たらぬ。この調子で満遍なく学習を続けるがよい！`; }
      return evalText;
    }

    function renderQuizHTML() {

        else { footerHtml = `<div class="flex gap-4 animate-fade-in h-full"><button onclick="handleAnswer(false)" class="flex-1 bg-rose-100 text-rose-600 border-2 border-rose-200 font-bold text-lg p-4 rounded-2xl hover:bg-rose-200 active:scale-95 transition-all flex flex-col items-center justify-center shadow-sm"><i class="ph-fill ph-x text-2xl mb-1"></i><span class="text-sm">間違えた</span></button><button onclick="handleAnswer(true)" class="flex-1 bg-emerald-500 text-white font-bold text-lg p-4 rounded-2xl shadow-md hover:bg-emerald-600 active:scale-95 transition-all flex flex-col items-center justify-center"><i class="ph-fill ph-check text-2xl mb-1"></i><span class="text-sm">覚えた！</span></button></div>`; }
      }

    // PINコード入力画面

rds[state.activeUser] ? `<button onclick="removePin()" class="text-xs sm:text-sm text-red-500 hover:text-red-700 font-bold mt-4 py-2 px-4 rounded-xl border border-red-200 hover:bg-red-50 transition-colors flex items-center justify-center mx-auto w-full shadow-sm bg-white"><i class="ph-fill ph-trash text-lg mr-1"></i>パスワードを解除する</button>` : ''}</div></div>`;

 active:scale-95 transition-all mx-auto shadow-[0_0_15px_rgba(0,0,0,0.8)] bg-black/60 backdrop-blur-sm">${n}</button>`).join('')}<button onclick="deletePasscode()" class="w-16 h-16 rounded-full flex items-center justify-center border border-red-900 text-red-600 text-3xl hover:bg-red-900/60 active:scale-95 transition-all mx-auto shadow-[0_0_15px_rgba(0,0,0,0.8)] bg-black/60 backdrop-blur-sm"><i class="ph-fill ph-backspace"></i></button><button onclick="inputPasscode('0')" class="w-16 h-16 rounded-full border border-red-900 text-red-500 text-2xl font-bold hover:bg-red-900/60 active:scale-95 transition-all mx-auto shadow-[0_0_15px_rgba(0,0,0,0.8)] bg-black/60 backdrop-blur-sm">0</button><button onclick="closePasscode()" class="w-16 h-16 rounded-full border border-gray-800 text-gray-400 text-sm font-bold hover:text-gray-200 active:scale-95 transition-all mx-auto shadow-[0_0_15px_rgba(0,0,0,0.8)] bg-black/60 backdrop-blur-sm">戻る</button></div></div></div>`;

    function renderParentDashboardHTML() {
      const userName = userThemes[state.activeUser] ? userThemes[state.activeUser].name : 'さくら'; let totalAttempts = 0; let totalMistakes = 0;
      const analyzedData = rawData.map(q => { const stat = state.userStats[q.id] || { corrects: 0, mistakes: 0 }; const total = stat.corrects + stat.mistakes; totalAttempts += total; totalMistakes += stat.mistakes; return { ...q, stat, total, mistakeRate: total > 0 ? Math.round((stat.mistakes / total) * 100) : 0 }; }).filter(q => q.total > 0).sort((a, b) => b.mistakeRate - a.mistakeRate || b.stat.mistakes - a.stat.mistakes);

<p class="text-xs text-gray-500 mb-1 tracking-wider">総合正答率</p><p class="text-2xl font-black text-blue-400">${accuracy}%</p></div></div><div><h3 class="text-lg font-bold text-gray-300 mb-4 flex items-center tracking-widest border-l-2 border-red-900 pl-3"><i class="ph-fill ph-warning text-xl mr-2 text-red-600"></i>罪深き問題リスト（苦手トップ）</h3><div class="space-y-3">${listHtml}</div></div></div></div>`;
    }
